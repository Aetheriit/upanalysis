version: "3.9"

services:
  # PostgreSQL + PostGIS
  db:
    image: postgis/postgis:16-3.4
    container_name: election_intel_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: election_intel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: election_intel_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: election_intel_api
    # We no longer expose the backend directly, Caddy will proxy to it
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/election_intel
      - REDIS_URL=redis://redis:6379/0
      - DEBUG=false # Set to false for production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
      - "./2017 data:/2017 data"
      - "./2022 data:/2022 data"
      - "./2022 data 2:/2022 data 2"
      - "./2022 missing:/2022 missing"
      - "./up_2017_results.csv:/app/up_2017_results.csv:ro"

  # Caddy Reverse Proxy
  caddy:
    image: caddy:2-alpine
    container_name: election_intel_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
